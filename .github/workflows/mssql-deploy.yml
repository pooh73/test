name: MS SQL Deploy with More Steps

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, windows-mssql]

    steps:
      # Krok 1: pobranie kodu z repozytorium
      - name: Pobranie kodu
        uses: actions/checkout@v4

      # Krok 2: sprawdzenie dostepnosci serwera przed wdrozeniem
      - name: Test polaczenia z MS SQL
        shell: cmd
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASS }}" -b -Q "SELECT @@VERSION;"

      # Krok 3: uruchomienie paczki instalacyjnej .bat
      - name: Instalacja paczki (.bat)
        shell: cmd
        run: |
          call deploy\install.bat "${{ secrets.SQL_SERVER }}" "${{ secrets.SQL_DB }}" "${{ secrets.SQL_USER }}" "${{ secrets.SQL_PASS }}"

      # Krok 4: weryfikacja obiektow i danych
      - name: Weryfikacja stanu bazy (verify.sql)
        shell: cmd
        run: |
          sqlcmd -S "${{ secrets.SQL_SERVER }}" -d "${{ secrets.SQL_DB }}" -U "${{ secrets.SQL_USER }}" -P "${{ secrets.SQL_PASS }}" -b -i "deploy\verify.sql"

      # Krok 5: dodatkowy krok (np. w PowerShellu) po udanym wdrozeniu
      - name: Podsumowanie w PowerShellu
        shell: powershell
        run: |
          Write-Host "Wdrozenie i weryfikacja zakonczone pomyslnie na serwerze ${{ secrets.SQL_SERVER }}."
